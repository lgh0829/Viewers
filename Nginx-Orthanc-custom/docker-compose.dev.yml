services:
  # Development server for OHIF Viewer
  ohif_dev:
    build:
      # 프로젝트 루트 디렉토리로 컨텍스트 설정
      context: ./../
      dockerfile: ./platform/app/.recipes/Nginx-Orthanc-custom/dockerfile.dev
    image: webapp:latest
    container_name: ohif_orthanc
    volumes:
      # Nginx config
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      # Logs
      - ./logs/nginx:/var/logs/nginx
      # Let's Encrypt
      # - letsencrypt_certificates:/etc/letsencrypt
      # - letsencrypt_challenges:/var/www/letsencrypt
    ports:
      - '443:443' # SSL
      - '80:80' # Web
    depends_on:
      #   - keycloak
      - orthanc
    restart: on-failure

  # Orthanc DICOM server
  orthanc:
    image: jodogne/orthanc-plugins
    hostname: orthanc
    container_name: orthanc_dev
    volumes:
      # Config
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
      # Persist data
      - ./volumes/orthanc-db/:/var/lib/orthanc/db/
    restart: unless-stopped
    ports:
      - '4242:4242' # Orthanc REST API
      - '8042:8042' # Orthanc HTTP

networks:
  default:
    name: ohif-dev-network
